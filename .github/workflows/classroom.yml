name: Autograding Tests

on:
  - push
  - repository_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Papan 6x6 (36 petak), jarak 35 -> 5x6 + 5 = 6 langkah
      - name: Case 01 - Papan 6x6 tanpa tangga & naga (jawab 6)
        id: case-01
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 01 - Papan 6x6 tanpa tangga & naga (jawab 6)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            0
            0
          expected-output: |
            6
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Tangga 2->36: lempar 1 ke petak 2, langsung naik ke 36
      - name: Case 02 - Tangga langsung ke petak akhir (jawab 1)
        id: case-02
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 02 - Tangga langsung ke petak akhir (jawab 1)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            1
            2 36
            0
          expected-output: |
            1
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Tangga 7->30: langkah 1 (1->7 naik ke 30), langkah 2 (30->36)
      - name: Case 03 - Satu tangga mempercepat langkah (jawab 2)
        id: case-03
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 03 - Satu tangga mempercepat langkah (jawab 2)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            1
            7 30
            0
          expected-output: |
            2
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Tangga berantai: 1->2(naik 15), 15->16(naik 29), 29->30(naik 36)
      - name: Case 04 - Tangga berantai 3 langkah (jawab 3)
        id: case-04
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 04 - Tangga berantai 3 langkah (jawab 3)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            3
            2 15
            16 29
            30 36
            0
          expected-output: |
            3
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Tangga pendek: 1->4(naik 14) -> 20 -> 26 -> 32 -> 36 (5 langkah)
      - name: Case 05 - Tangga pendek hemat 1 langkah (jawab 5)
        id: case-05
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 05 - Tangga pendek hemat 1 langkah (jawab 5)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            1
            4 14
            0
          expected-output: |
            5
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Dua opsi tangga: 2->20 (selesai 4 langkah) vs 6->31 (selesai 2 langkah)
      - name: Case 06 - Memilih tangga paling optimal (jawab 2)
        id: case-06
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 06 - Memilih tangga paling optimal (jawab 2)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            2
            2 20
            6 31
            0
          expected-output: |
            2
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Naga di petak 7, 13, 19, 25, 31 memaksa langkah tidak selalu +6 (jadi 7 langkah)
      - name: Case 07 - Naga menghalangi jalur optimal +6 (jawab 7)
        id: case-07
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 07 - Naga menghalangi jalur optimal +6 (jawab 7)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            0
            5
            7 1
            13 1
            19 1
            25 1
            31 1
          expected-output: |
            7
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Petak 2-7 semuanya naga kembali ke petak 1, mustahil maju
      - name: Case 08 - Naga memblokir semua jalan keluar dari start (jawab -1)
        id: case-08
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 08 - Naga memblokir semua jalan keluar dari start (jawab -1)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            0
            6
            2 1
            3 1
            4 1
            5 1
            6 1
            7 1
          expected-output: |
            -1
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Tangga di petak 1 (1->36) tidak aktif saat mulai dari petak 1 (jawab tetap 6)
      - name: Case 09 - Tangga di petak 1 tidak berpengaruh (jawab 6)
        id: case-09
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 09 - Tangga di petak 1 tidak berpengaruh (jawab 6)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            1
            1 36
            0
          expected-output: |
            6
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Trik naga untuk mundur: 1->7(naik 25), 25->27(naga turun ke 22), 22->23(naik 36) = 3 langkah
      - name: Case 10 - Memanfaatkan naga untuk mencapai dasar tangga (jawab 3)
        id: case-10
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 10 - Memanfaatkan naga untuk mencapai dasar tangga (jawab 3)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            2
            7 25
            23 36
            1
            27 22
          expected-output: |
            3
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Campuran tangga dan naga: 1->2(15) -> 16..20 -> 25(35) -> 36 (4 langkah)
      - name: Case 11 - Papan 6x6 campuran tangga & naga (jawab 4)
        id: case-11
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 11 - Papan 6x6 campuran tangga & naga (jawab 4)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            3
            2 15
            10 30
            25 35
            4
            14 3
            29 4
            33 9
            34 5
          expected-output: |
            4
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Dinding 6 naga berurutan di petak 20-25 dan tidak ada tangga yang melompatinya
      - name: Case 12 - Dinding naga di tengah papan tanpa tangga pelompat (jawab -1)
        id: case-12
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 12 - Dinding naga di tengah papan tanpa tangga pelompat (jawab -1)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            1
            3 15
            6
            20 2
            21 2
            22 2
            23 2
            24 2
            25 2
          expected-output: |
            -1
          comparison-method: exact
          timeout: 2
          max-score: 5

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          CASE-01_RESULTS: "${{steps.case-01.outputs.result}}"
          CASE-02_RESULTS: "${{steps.case-02.outputs.result}}"
          CASE-03_RESULTS: "${{steps.case-03.outputs.result}}"
          CASE-04_RESULTS: "${{steps.case-04.outputs.result}}"
          CASE-05_RESULTS: "${{steps.case-05.outputs.result}}"
          CASE-06_RESULTS: "${{steps.case-06.outputs.result}}"
          CASE-07_RESULTS: "${{steps.case-07.outputs.result}}"
          CASE-08_RESULTS: "${{steps.case-08.outputs.result}}"
          CASE-09_RESULTS: "${{steps.case-09.outputs.result}}"
          CASE-10_RESULTS: "${{steps.case-10.outputs.result}}"
          CASE-11_RESULTS: "${{steps.case-11.outputs.result}}"
          CASE-12_RESULTS: "${{steps.case-12.outputs.result}}"
        with:
          runners: case-01,case-02,case-03,case-04,case-05,case-06,case-07,case-08,case-09,case-10,case-11,case-12
